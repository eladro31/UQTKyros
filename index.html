<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UQT S.A. - Pasajeros Línea 31A</title>
  <style>
    :root {
      --bg: #031b33;
      --card-bg: #072a4a;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --orange: #f97316;
      --border: #1e4976;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header-greeting {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--green);
      margin-bottom: 5px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.1rem;
      color: var(--green);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      background-color: #15803d;
      color: white;
      margin-top: 5px;
      font-size: 0.95rem;
    }

    .badge-red { background-color: var(--red); }
    .badge-yellow { background-color: var(--yellow); color: #031b33; }
    .badge-orange { background-color: var(--orange); }

    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: white;
      box-sizing: border-box;
    }

    .btn-pdf {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--green);
      color: #031b33;
      font-weight: bold;
      padding: 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1rem;
      margin-top: 15px;
      box-sizing: border-box;
    }

    .schedule-list {
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .schedule-item {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .highlight {
      color: var(--green);
      font-weight: bold;
    }

    .alert-box {
      padding: 12px;
      border-radius: 6px;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--red);
      color: #fca5a5;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-greeting">¡Buenas! 👋</div>
    <p style="color: var(--text-muted); margin-top: 0;">Bienvenido al portal de la Línea 31A de UQT S.A.</p>

    <!-- Estado del Servicio -->
    <div class="card">
      <h2>Estado del Servicio Línea 31A</h2>
      <div id="status-31a" class="badge">Cargando...</div>
    </div>

    <!-- Ver Horarios por Parada -->
    <div class="card">
      <h2>Ver Horarios por Parada</h2>
      
      <label for="select-sentido">Sentido de Circulación:</label>
      <select id="select-sentido">
        <option value="Playa">Hacia Playa (Ida)</option>
        <option value="Terminal">Hacia Terminal (Vuelta)</option>
      </select>

      <label for="select-parada" style="margin-top: 12px; display:block;">Seleccionar Parada:</label>
      <select id="select-parada">
        <!-- Opciones dinámicas según sentido -->
      </select>

      <div id="schedule-results" class="schedule-list">
        <!-- Los horarios filtrados aparecen aquí -->
      </div>
    </div>

    <!-- Estado Terminal Brookhaven -->
    <div class="card">
      <h2>Estado Terminal Brookhaven</h2>
      <div id="status-terminal" class="badge">Cargando...</div>
      <p style="margin-top: 12px; font-size: 0.95rem;">
        Hoy la línea 31A para en las plataformas <span id="plataformas-text" class="highlight">__</span> de la terminal.
      </p>
    </div>

    <!-- Botón Descargar PDF -->
    <a href="Horarios_y_Tarifas_Linea_31A_UQT.pdf" download class="btn-pdf">
      📄 DESCARGAR PDF DE HORARIOS Y TARIFAS
    </a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCqxQMrZatu32xnJAkVrrFLoLXNymJeH3A",
      authDomain: "uqtkyros.firebaseapp.com",
      projectId: "uqtkyros",
      storageBucket: "uqtkyros.firebasestorage.app",
      messagingSenderId: "209955691423",
      appId: "1:209955691423:web:916e78851d938f2f537baa",
      measurementId: "G-Z31MPBSJS5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let estadoActualGeneral = "Normal";

    const paradasPlaya = [
      { id: "Terminal", nombre: "1. Terminal" },
      { id: "Spawn", nombre: "2. Spawn" },
      { id: "Piscina", nombre: "3. Piscina" },
      { id: "Esquinas", nombre: "4. Esquinas" },
      { id: "Campamento", nombre: "5. Campamento" },
      { id: "Playa", nombre: "6. Playa" }
    ];

    const paradasTerminal = [
      { id: "Playa", nombre: "1. Playa" },
      { id: "Campamento", nombre: "2. Campamento" },
      { id: "Esquinas", nombre: "3. Esquinas" },
      { id: "Piscina", nombre: "4. Piscina" },
      { id: "Spawn", nombre: "5. Spawn" },
      { id: "Terminal", nombre: "6. Terminal" }
    ];

    // Actualizar selector de paradas según sentido
    function actualizarOpcionesParadas() {
      const sentido = document.getElementById("select-sentido").value;
      const selectParada = document.getElementById("select-parada");
      const lista = sentido === "Playa" ? paradasPlaya : paradasTerminal;

      selectParada.innerHTML = lista.map(p => `<option value="${p.id}">${p.nombre}</option>`).join("");
    }

    // Sincronización en vivo de estado general y terminal
    onSnapshot(doc(db, "uqt_config", "general"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        estadoActualGeneral = data.estado31A || "Normal";

        const statusEl = document.getElementById("status-31a");
        statusEl.className = "badge";

        if (estadoActualGeneral === "Normal") {
          statusEl.innerText = "Normal 🟢 (Horarios Lun a Vie)";
        } else if (estadoActualGeneral === "Fin de semana") {
          statusEl.innerText = "Fin de Semana 🟡 (Horarios Sáb, Dom y Fer)";
          statusEl.classList.add("badge-yellow");
        } else if (estadoActualGeneral === "Reducido") {
          statusEl.innerText = "Servicio Reducido 🟠";
          statusEl.classList.add("badge-orange");
        } else if (estadoActualGeneral === "No en funcionamiento") {
          statusEl.innerText = "No en Funcionamiento 🔴";
          statusEl.classList.add("badge-red");
        } else {
          statusEl.innerText = estadoActualGeneral;
        }

        document.getElementById("status-terminal").innerText = data.estadoTerminal || "Abierta 🟢";
        document.getElementById("plataformas-text").innerText = data.plataformas || "__";

        updateScheduleView();
      }
    });

    // Filtrar y renderizar la grilla de horarios
    async function updateScheduleView() {
      const sentido = document.getElementById("select-sentido").value;
      const parada = document.getElementById("select-parada").value;
      const container = document.getElementById("schedule-results");

      if (estadoActualGeneral === "No en funcionamiento") {
        container.innerHTML = `
          <div class="alert-box">
            🔴 <strong>SERVICIO INTERRUMPIDO</strong><br>
            La Línea 31A no se encuentra prestando servicio temporalmente.
          </div>`;
        return;
      }

      container.innerHTML = "<p style='color: var(--text-muted);'>Buscando salidas...</p>";

      const q = query(collection(db, "horarios"), where("sentido", "==", sentido));
      const querySnapshot = await getDocs(q);

      container.innerHTML = "";
      let contador = 0;

      querySnapshot.forEach((doc) => {
        const data = doc.data();

        // Filtrado estricto por tipo de día según Estado General
        let mostrar = false;
        if (estadoActualGeneral === "Normal" && data.tipo === "Lun-Vie") mostrar = true;
        else if (estadoActualGeneral === "Fin de semana" && data.tipo === "Sab-Dom-Fer") mostrar = true;
        else if (estadoActualGeneral === "Reducido") mostrar = true; // En reducido muestra disponibilidad general

        if (mostrar && data.paradas && data.paradas[parada]) {
          contador++;
          const estadoBadge = data.estado ? `<small style="color: var(--text-muted);">[${data.estado}]</small>` : '';
          
          container.innerHTML += `
            <div class="schedule-item">
              <div>
                <strong>Servicio ${doc.id}</strong> ${estadoBadge}
              </div>
              <span class="highlight">Pasa: ${data.paradas[parada]} hs</span>
            </div>
          `;
        }
      });

      if (contador === 0) {
        container.innerHTML = "<p style='color: var(--text-muted);'>No hay salidas disponibles para este cronograma y parada.</p>";
      }
    }

    // Event Listeners
    document.getElementById("select-sentido").addEventListener("change", () => {
      actualizarOpcionesParadas();
      updateScheduleView();
    });

    document.getElementById("select-parada").addEventListener("change", updateScheduleView);

    // Inicialización
    actualizarOpcionesParadas();
  </script>
</body>
</html>
